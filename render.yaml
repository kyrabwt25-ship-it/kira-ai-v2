services:
  - type: web
    name: kira-ai
    runtime: python

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/plans

    envVars:
      # OpenRouter AI
      - key: OPENROUTER_API_KEY
        sync: false

      - key: TOP_MODEL
        value: openrouter/free

      - key: FALLBACK_MODEL
        value: openrouter/free

      # Supabase
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SUPABASE_SERVICE_KEY
        sync: false

      # Developer
      - key: DEVELOPER_EMAIL
        value: kyrabwt22@gmail.com

      # Payment configuration
      - key: VCASH_NUMBER
        value: "01017332544"

      - key: MANUAL_PAY_NOTE
        sync: false

      - key: PAYMENT_URL_TEMPLATE
        sync: false

      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
